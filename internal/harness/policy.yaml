# Sandbox network allow-list (.rnes/policy.yaml overrides these built-in defaults).
#
# policy and mode select the schema (v1, allowlist). hosts maps each allowed
# endpoint to its optional settings; everything else is blocked (403 from
# rnes-proxy). This session's llama-server (and any configured cloud model
# provider) are added automatically.
#
# The port may be "*" to allow every port on that host, e.g.
# "example.com:*": {}. A wildcard host is not allowed; pass -allow-public on
# the command line instead.
#
# Optional per-entry settings:
#   private: true       let this endpoint resolve to a private address
#                       (RFC 1918 / IPv6 ULA), such as a service on your
#                       machine or LAN.
#   no-inspect: true    pass its TLS traffic through unread instead of
#                       decrypting it (needed for HTTP/2, gRPC, WebSockets, or
#                       certificate-pinned endpoints).
#   key: Authorization   HTTP header the proxy fills in for a generic auth
#                        provider; value names the host environment variable
#                        holding the secret. Both must be set together, and the
#                        entry must be inspected.
#   format: Bearer {value}
#                        how the secret is written into that header; {value} is
#                        the secret. Optional: without it, the header value is
#                        the secret alone.
#
# Pass -allow-private to reach any private address outside the list. Remove
# all hosts to restrict the sandbox to its model provider only.

policy: v1
mode: allowlist

hosts:
  # npm packages
  "registry.npmjs.org:443": {}

  # GitHub: git over https, and the API that gh uses
  "github.com:443": {}
  "api.github.com:443": {}

  # opencode's model catalog and website, fetched at startup
  "models.dev:443": {}
  "models.opencode.ai:443": {}
  "opencode.ai:443": {}

  # Common package registries
  "proxy.golang.org:443": {}
  "sum.golang.org:443": {}
  "pypi.org:443": {}
  "files.pythonhosted.org:443": {}
  "crates.io:443": {}
  "static.crates.io:443": {}
